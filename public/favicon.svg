<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Toolbox body -->
  <rect x="100" y="200" width="312" height="200" rx="24" fill="#ffffff" opacity="0.95"/>
  
  <!-- Toolbox handle -->
  <path d="M 180 200 L 180 160 Q 180 140 200 140 L 312 140 Q 332 140 332 160 L 332 200" 
        stroke="#ffffff" stroke-width="28" fill="none" opacity="0.95" stroke-linecap="round"/>
  
  <!-- Tool 1: Wrench -->
  <g transform="translate(160, 260)">
    <circle cx="0" cy="0" r="24" fill="#3b82f6"/>
    <rect x="-8" y="0" width="16" height="60" rx="8" fill="#3b82f6"/>
  </g>
  
  <!-- Tool 2: Gear -->
  <g transform="translate(256, 280)">
    <circle cx="0" cy="0" r="28" fill="#3b82f6"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
    <g fill="#3b82f6">
      <rect x="-6" y="-36" width="12" height="16" rx="4"/>
      <rect x="-6" y="20" width="12" height="16" rx="4"/>
      <rect x="-36" y="-6" width="16" height="12" rx="4"/>
      <rect x="20" y="-6" width="16" height="12" rx="4"/>
    </g>
  </g>
  
  <!-- Tool 3: Screwdriver -->
  <g transform="translate(352, 260)">
    <rect x="-8" y="0" width="16" height="50" rx="8" fill="#3b82f6"/>
    <path d="M -12 50 L 12 50 L 8 70 L -8 70 Z" fill="#3b82f6"/>
  </g>
</svg>
